ShortDescription: Tray launchpad with live system telemetry and a desktop vault
Description: CyberTray keeps a launchpad one click away in the system tray, a shelf of apps, files, folders and URLs with search, categories and drag-and-drop, summoned by a hotkey, a screen corner or the tray icon and hidden again when you are done. Beside it, live RAM, CPU, disk and VRAM telemetry, a process viewer that can end what is misbehaving, and a PIN-protected vault you can sweep the desktop into. Portable mode and scheduled backups to a folder you pick keep the whole setup with you. Built with Electron.
