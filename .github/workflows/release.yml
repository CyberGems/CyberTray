name: Release Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Refresh About icons from official app repositories
        uses: CyberGems/CyberSnap/.github/actions/sync-suite-icons@80266c5b4ad7fa4c5768e2543a4c7c7a461fc8f7
        with:
          config: .github/about-icons.json

      - name: Validate release summary
        run: node .github/scripts/validate-release-summary.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile and Package Electron App
        # --publish never: packaging only. Artifact upload is handled below.
        # electron-builder otherwise auto-publishes on tags and fails without GH_TOKEN.
        # latest.yml + .blockmap are required by electron-updater.
        run: npm run build && npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Build Artifacts to Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: CyberTray-Windows-Installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Prepare Release Notes & Scan with VirusTotal
        id: virustotal
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          $installer = Get-ChildItem -Path "release" -Filter "CyberTray-Setup-*.exe" |
            Where-Object { $_.Name -notlike "*.blockmap*" } |
            Select-Object -First 1
          if (-not $installer) {
            throw "Installer .exe not found in release/"
          }

          $portable = Get-ChildItem -Path "release" -Filter "CyberTray-Portable-*.exe" |
            Where-Object { $_.Name -notlike "*.blockmap*" } |
            Select-Object -First 1
          if (-not $portable) {
            throw "Portable .exe not found in release/"
          }

          $tag = "${{ github.ref_name }}"
          $versionNum = $tag.TrimStart("v")
          $installerHash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          $portableHash = (Get-FileHash $portable.FullName -Algorithm SHA256).Hash.ToLower()

          Write-Host "Installer: $($installer.Name)"
          Write-Host "Installer SHA256: $installerHash"
          Write-Host "Portable: $($portable.Name)"
          Write-Host "Portable SHA256: $portableHash"

          if ($env:VIRUSTOTAL_API_KEY) {
            function Upload-VirusTotal($filePath, $apiKey) {
              $item = Get-Item $filePath
              $sizeMb = [Math]::Round($item.Length / 1MB, 2)
              Write-Host "Uploading $filePath ($sizeMb MB) to VirusTotal..."
              $headers = @{ "x-apikey" = $apiKey }
              $url = "https://www.virustotal.com/api/v3/files"

              if ($item.Length -gt 30MB) {
                Write-Host "File exceeds 30MB ($sizeMb MB), requesting dedicated large-file upload endpoint from VirusTotal..."
                $urlResp = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files/upload_url" -Method Get -Headers $headers -TimeoutSec 60
                $url = $urlResp.data
                Write-Host "Using dedicated endpoint: $url"
              }

              $resp = & curl.exe -s -S --fail -X POST -H "x-apikey: $apiKey" -F "file=@$filePath" "$url"
              Write-Host "Upload successful. Response: $resp"
            }

            try {
              Upload-VirusTotal $installer.FullName $env:VIRUSTOTAL_API_KEY
              Upload-VirusTotal $portable.FullName $env:VIRUSTOTAL_API_KEY
            } catch {
              Write-Warning "VirusTotal upload warning: $_"
            }
          } else {
            Write-Host "VIRUSTOTAL_API_KEY secret not found; skipping the upload. The report link only resolves once the file has been submitted to VirusTotal."
          }

          $template = [System.IO.File]::ReadAllText(".github/release-template.md", [System.Text.Encoding]::UTF8)
          $notes = $template.
            Replace("{{VERSION_NUM}}", $versionNum).
            Replace("{{VERSION}}", $tag).
            Replace("{{INSTALLER_HASH}}", $installerHash).
            Replace("{{PORTABLE_HASH}}", $portableHash)
          $utf8 = New-Object System.Text.UTF8Encoding $false
          $notes = [regex]::Replace($notes, '(?s)<!--.*?-->', '').Trim()
          [System.IO.File]::WriteAllText("FINAL_RELEASE_NOTES.md", $notes, $utf8)

      - name: Generate winget manifests
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # winget versions carry no 'v' prefix (1.9.0, not v1.9.0); URLs keep the tag's.
          $bareVersion = $tag.TrimStart('v')
          $installer = Get-ChildItem -Path "release" -Filter "CyberTray-Setup-*.exe" |
            Where-Object { $_.Name -notlike "*.blockmap*" } |
            Select-Object -First 1
          if (-not $installer) { throw "CyberTray setup installer not found in ./release" }
          $installerHash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          $manifestFiles = @{
              "winget-version.yaml"   = "CyberGems.CyberTray.yaml"
              "winget-locale.yaml"    = "CyberGems.CyberTray.locale.en-US.yaml"
              "winget-installer.yaml" = "CyberGems.CyberTray.installer.yaml"
          }
          New-Item -ItemType Directory -Path winget-pkg -Force | Out-Null
          foreach ($entry in $manifestFiles.GetEnumerator()) {
              $manifestTemplate = [System.IO.File]::ReadAllText($entry.Key, [System.Text.Encoding]::UTF8)
              $manifest = $manifestTemplate.Replace("{{VERSION}}", $bareVersion).Replace("{{TAG}}", $tag).Replace("{{INSTALLER_HASH}}", $installerHash)
              [System.IO.File]::WriteAllText("winget-pkg/$($entry.Value)", $manifest, [System.Text.Encoding]::UTF8)
          }
          winget validate winget-pkg
          if ($LASTEXITCODE -ne 0) { throw "winget manifest validation failed." }
          Write-Host "Generated and validated winget manifests for $tag."

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: CyberTray ${{ github.ref_name }}
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            winget-pkg/CyberGems.CyberTray.yaml
            winget-pkg/CyberGems.CyberTray.locale.en-US.yaml
            winget-pkg/CyberGems.CyberTray.installer.yaml
          draft: true
          prerelease: false
          body_path: FINAL_RELEASE_NOTES.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Final guard: action-gh-release can keep an existing draft body and has
      # been observed to publish even with draft: true. Apply notes and re-assert draft.
      - name: Apply release notes and force draft
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release edit $tag --notes-file FINAL_RELEASE_NOTES.md --draft
          $state = gh release view $tag --json isDraft --jq .isDraft
          if ($state -ne "true") {
            throw "Failed to force $tag back to draft (isDraft=$state)"
          }
          Write-Host "Release $tag confirmed as draft with filled notes."
      # Publish a downloadable checksum file so users can verify assets with
      # sha256sum -c without copying hashes from the release notes.
      - name: Publish SHA256SUMS.txt
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          $dir = Join-Path $env:RUNNER_TEMP 'sha256sums'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          $assetNames = @(gh release view $tag --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw "Could not list release assets for $tag." }
          $portable = $assetNames | Where-Object { $_ -match 'portable' } | Select-Object -First 1
          $installer = $assetNames | Where-Object { $_ -match '\.(exe|msi)$' -and $_ -notmatch 'portable' } | Select-Object -First 1
          $wanted = @($installer, $portable) | Where-Object { $_ }
          if (-not $wanted) { throw "No installer or portable asset found for $tag." }

          gh release download $tag --dir $dir --clobber $(foreach ($name in $wanted) { "--pattern=$name" })
          if ($LASTEXITCODE -ne 0) { throw "Could not download release assets for $tag." }

          $lines = @()
          foreach ($name in $wanted) {
            $path = Join-Path $dir $name
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$hash  $name"
          }
          $checksumPath = Join-Path $dir 'SHA256SUMS.txt'
          [System.IO.File]::WriteAllText($checksumPath, ($lines -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))
          gh release upload $tag $checksumPath --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload SHA256SUMS.txt for $tag." }
