name: Release Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Refresh About icons from official app repositories
        uses: CyberGems/CyberSnap/.github/actions/sync-suite-icons@80266c5b4ad7fa4c5768e2543a4c7c7a461fc8f7
        with:
          config: .github/about-icons.json

      - name: Validate release summary
        run: node .github/scripts/validate-release-summary.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile and Package Electron App
        # --publish never: packaging only. Artifact upload is handled below.
        # electron-builder otherwise auto-publishes on tags and fails without GH_TOKEN.
        # latest.yml + .blockmap are required by electron-updater.
        run: npm run build && npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Build Artifacts to Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: CyberTray-Windows-Installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Prepare Release Notes & Scan with VirusTotal
        id: virustotal
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          $installer = Get-ChildItem -Path "release" -Filter "CyberTray-Setup-*.exe" |
            Where-Object { $_.Name -notlike "*.blockmap*" } |
            Select-Object -First 1
          if (-not $installer) {
            throw "Installer .exe not found in release/"
          }

          $portable = Get-ChildItem -Path "release" -Filter "CyberTray-Portable-*.exe" |
            Where-Object { $_.Name -notlike "*.blockmap*" } |
            Select-Object -First 1
          if (-not $portable) {
            throw "Portable .exe not found in release/"
          }

          $tag = "${{ github.ref_name }}"
          $versionNum = $tag.TrimStart("v")
          $installerHash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          $portableHash = (Get-FileHash $portable.FullName -Algorithm SHA256).Hash.ToLower()

          Write-Host "Installer: $($installer.Name)"
          Write-Host "Installer SHA256: $installerHash"
          Write-Host "Portable: $($portable.Name)"
          Write-Host "Portable SHA256: $portableHash"

          if ($env:VIRUSTOTAL_API_KEY) {
            function Upload-VirusTotal($filePath, $apiKey) {
              $item = Get-Item $filePath
              $sizeMb = [Math]::Round($item.Length / 1MB, 2)
              Write-Host "Uploading $filePath ($sizeMb MB) to VirusTotal..."
              $headers = @{ "x-apikey" = $apiKey }
              $url = "https://www.virustotal.com/api/v3/files"

              if ($item.Length -gt 30MB) {
                Write-Host "File exceeds 30MB ($sizeMb MB), requesting dedicated large-file upload endpoint from VirusTotal..."
                $urlResp = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files/upload_url" -Method Get -Headers $headers -TimeoutSec 60
                $url = $urlResp.data
                Write-Host "Using dedicated endpoint: $url"
              }

              $resp = & curl.exe -s -S --fail -X POST -H "x-apikey: $apiKey" -F "file=@$filePath" "$url"
              Write-Host "Upload successful. Response: $resp"
            }

            try {
              Upload-VirusTotal $installer.FullName $env:VIRUSTOTAL_API_KEY
              Upload-VirusTotal $portable.FullName $env:VIRUSTOTAL_API_KEY
            } catch {
              Write-Warning "VirusTotal upload warning: $_"
            }
          } else {
            Write-Host "VIRUSTOTAL_API_KEY secret not found; skipping the upload. The report link only resolves once the file has been submitted to VirusTotal."
          }

          $template = [System.IO.File]::ReadAllText(".github/release-template.md", [System.Text.Encoding]::UTF8)
          $notes = $template.
            Replace("{{VERSION_NUM}}", $versionNum).
            Replace("{{VERSION}}", $tag).
            Replace("{{INSTALLER_HASH}}", $installerHash).
            Replace("{{PORTABLE_HASH}}", $portableHash)
          $utf8 = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("FINAL_RELEASE_NOTES.md", $notes, $utf8)

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: CyberTray ${{ github.ref_name }}
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          draft: true
          prerelease: false
          body_path: FINAL_RELEASE_NOTES.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Final guard: action-gh-release can keep an existing draft body and has
      # been observed to publish even with draft: true. Apply notes and re-assert draft.
      - name: Apply release notes and force draft
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release edit $tag --notes-file FINAL_RELEASE_NOTES.md --draft
          $state = gh release view $tag --json isDraft --jq .isDraft
          if ($state -ne "true") {
            throw "Failed to force $tag back to draft (isDraft=$state)"
          }
          Write-Host "Release $tag confirmed as draft with filled notes."
