name: Tray tooltip check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tray-tooltip:
    uses: CyberGems/.github/.github/workflows/tray-tooltip-check.yml@main

  tray-tooltip-tests:
    name: Tray tooltip tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/tray-tooltip.test.ts
