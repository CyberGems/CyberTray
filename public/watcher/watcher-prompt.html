<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: local-resource:; script-src 'self'; font-src 'self';"
  >
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberTray Watcher</title>
  <link rel="stylesheet" href="watcher-prompt.css">
</head>
<body>
  <div class="shell">
    <div class="card" role="dialog" aria-live="polite">
      <header class="head">
        <span class="dot" aria-hidden="true"></span>
        <h1 id="title" class="title"></h1>
        <span id="countdown" class="countdown" aria-hidden="true"></span>
        <button id="close" class="close" type="button" aria-label="Close">&times;</button>
      </header>

      <div class="meter" aria-hidden="true"><div id="meter" class="meter-fill"></div></div>

      <ul id="items" class="items"></ul>

      <div id="more-row" class="more-row" hidden>
        <button id="more" class="more-btn" type="button"></button>
      </div>

      <div class="folder">
        <span class="folder-label" id="folder-label">—</span>
        <div class="picker">
          <button
            id="folder-button"
            class="picker-trigger"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <span class="picker-dot" id="folder-dot" aria-hidden="true"></span>
            <span id="folder-value" class="picker-value"></span>
            <svg class="picker-chevron" viewBox="0 0 12 12" aria-hidden="true">
              <path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <div id="folder-menu" class="picker-menu" role="listbox" hidden></div>
        </div>
      </div>

      <footer class="actions">
        <button id="ignore" class="btn btn-ghost" type="button"></button>
        <button id="accept" class="btn btn-accent" type="button"></button>
      </footer>
    </div>
  </div>
  <script src="watcher-prompt.js"></script>
</body>
</html>
